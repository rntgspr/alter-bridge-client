[package]
name = "alter-bridge-cli"
description = "Local alter-bridge operator executable and reusable native notification adapters."
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "alter-bridge"
path = "src/main.rs"

[dependencies]
alter-bridge-protocol = { path = "../protocol" }
base64 = "0.22"
libc = "0.2"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
toml_edit = "0.22"
tungstenite = { version = "0.29", default-features = false, features = ["handshake", "native-tls"] }
ureq = { version = "3", default-features = false, features = ["json", "native-tls"] }
